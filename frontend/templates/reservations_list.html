{% extends "base.html" %}
{% block title %}Lista rezerwacji{% endblock %}
{% block h1 %}Wszystkie rezerwacje{% endblock %}
{% block subtitle %}Przeglądaj rezerwacje wg statusu, sali i użytkowników{% endblock %}

{% block content %}
<div id="msg-error" class="error"></div>

<table class="table" id="reservations-table" style="width:100%;border-collapse:collapse">
  <thead>
    <tr>
      <th>ID</th>
      <th>Data / Godziny</th>
      <th>Sala</th>
      <th>Budynek</th>
      <th>Użytkownik</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
  const msgErr = document.getElementById('msg-error');
  function showErr(msg){ msgErr.textContent = msg; msgErr.style.display='block'; }
  function hideErr(){ msgErr.style.display='none'; msgErr.textContent=''; }

  const tbody = document.querySelector("#reservations-table tbody");
  const STATUS = { 1:"Aktywna", 2:"Anulowana", 3:"Zakończona" };
  const BUILDNAME = { 1:"A", 2:"B"}

  async function loadReservations(){
    hideErr();
    try {
      const token = localStorage.getItem("access_token");
      const r = await fetch(`${window.API_BASE}/reservations/all`, {
        headers: { Authorization:`Bearer ${token}` }
      });
      if(!r.ok) throw new Error("Brak uprawnień lub błąd serwera");
      const data = await r.json();

      tbody.innerHTML = "";
      data.forEach(res=>{
        const tr = document.createElement("tr");
        tr.innerHTML = `
          <td style="text-align:right">${res.id}</td>
          <td>${new Date(res.start_time).toLocaleString()} – ${new Date(res.end_time).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</td>
          <td>${res.room?.room_number || res.room_id}</td>
          <td>${res.room?.building_id || "-"}</td>
          <td>${res.user?.email || res.user_id}</td>
          <td style="text-align:center">${STATUS[res.reservation_status_id] || res.reservation_status_id}</td>
        `;
        tbody.appendChild(tr);
      });

    } catch(err){
      showErr("Błąd: " + err.message);
    }
  }

  document.addEventListener("DOMContentLoaded", loadReservations);
</script>

<style>
  th, td { padding: 10px; border:1px solid var(--border); }
  th { background:rgba(255,255,255,.08); text-align:center; }
  tr:nth-child(even) { background:rgba(255,255,255,.03); }
</style>
{% endblock %}

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: room_reservation_db
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "${SQLSERVER_PASSWORD}"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "${SQLSERVER_PASSWORD}" -C -Q "SELECT 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: room_reservation_backend
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  backend-tests:
    build:
      context: ./backend
    container_name: room_reservation_backend_tests
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
    command: python -m pytest tests --cov=app
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
    container_name: room_reservation_frontend
    env_file:
      - .env
    ports:
      - "8080:8080"
    depends_on:
      - backend

volumes:
  sqlserver_data: